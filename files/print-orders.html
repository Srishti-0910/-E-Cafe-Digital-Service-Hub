<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print Orders - E-Cafe</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4ff; margin: 0; }
    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: white; text-align: center;
      padding: 50px 20px 40px; position: relative;
    }
    header h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 8px; }
    header p { color: #adb5bd; margin: 0; }
    .btn-back { position: absolute; top: 14px; left: 14px; font-weight: 600; }

    section { padding: 50px 20px; }
    .form-box {
      max-width: 580px;
      background: white;
      border-radius: 16px;
      padding: 35px 40px;
      margin: 0 auto;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }
    .form-box h3 { font-weight: 700; color: #1a1a2e; margin-bottom: 24px; text-align: center; }
    label { font-weight: 600; color: #444; }
    .form-control { border-radius: 8px; border: 1px solid #d0d7ff; padding: 10px 14px; }
    .form-control:focus { border-color: #007bff; box-shadow: 0 0 0 3px rgba(0,123,255,0.1); }
    .btn-submit {
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: white; border: none; border-radius: 30px;
      padding: 12px 0; width: 100%; font-size: 1rem;
      font-weight: 600; cursor: pointer; margin-top: 10px;
      transition: opacity 0.3s;
    }
    .btn-submit:hover { opacity: 0.9; }
    #orderSummary {
      background: #f0f4ff; border-radius: 12px;
      padding: 20px; margin-top: 24px; display: none;
    }
    #orderSummary h3 { font-weight: 700; color: #1a1a2e; margin-bottom: 14px; }
    #orderDetails { padding-left: 0; list-style: none; }
    #orderDetails li { padding: 6px 0; border-bottom: 1px solid #dee2e6; color: #444; }
    #orderDetails li:last-child { border: none; font-weight: 700; color: #007bff; font-size: 1.1rem; }
    .btn-pay {
      background: linear-gradient(135deg, #28a745, #1e7e34);
      color: white; border: none; border-radius: 30px;
      padding: 12px 0; width: 100%; font-size: 1rem;
      font-weight: 600; cursor: pointer; margin-top: 14px;
      transition: opacity 0.3s;
    }
    .btn-pay:hover { opacity: 0.9; }

    footer { background: #111; color: #adb5bd; text-align: center; padding: 24px 20px; }
    footer a { color: #00aaff; text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <button onclick="history.back()" class="btn btn-light btn-back">← Back</button>
    <h1>🖨️ Print Orders</h1>
    <p>Upload your file and place a print order</p>
  </header>

  <section>
    <div class="form-box">
      <h3>Place Your Print Order</h3>
      <form id="printOrderForm">
        <div class="form-group">
          <label for="documentType">Print Type</label>
          <select id="documentType" class="form-control" required>
            <option value="blackWhite">⬛ Black & White — ₹2 per page</option>
            <option value="color">🎨 Color — ₹5 per page</option>
          </select>
        </div>
        <div class="form-group">
          <label for="numPages">Number of Pages</label>
          <input type="number" id="numPages" class="form-control" required min="1" placeholder="Enter number of pages" />
        </div>
        <div class="form-group">
          <label for="fileUpload">Upload Your File</label>
          <input type="file" id="fileUpload" class="form-control" required />
          <small class="text-muted">Accepted: PDF, DOC, JPG, PNG</small>
        </div>
        <button type="button" id="submitOrder" class="btn-submit">📋 View Order Summary</button>
      </form>

      <div id="orderSummary">
        <h3>Order Summary</h3>
        <ul id="orderDetails"></ul>
        <button type="button" id="paymenttype" class="btn-pay">💳 Proceed to Payment</button>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2024 E-Cafe: Your Digital Service Hub. All Rights Reserved.</p>
    <p>Need assistance? <a href="mailto:support@e-cafe.com">Contact Support</a></p>
  </footer>

  <script>
    document.getElementById('submitOrder').addEventListener('click', function () {
      const documentType = document.getElementById('documentType').value;
      const numPages = parseInt(document.getElementById('numPages').value);
      const fileUpload = document.getElementById('fileUpload').files[0];

      if (!fileUpload) { alert('Please upload a file.'); return; }
      if (!numPages || numPages < 1) { alert('Please enter a valid number of pages.'); return; }

      const pricePerPage = documentType === 'color' ? 5 : 2;
      const totalPrice = numPages * pricePerPage;

      document.getElementById('orderDetails').innerHTML = `
        <li><strong>Document Type:</strong> ${documentType === 'color' ? '🎨 Color' : '⬛ Black & White'}</li>
        <li><strong>File Name:</strong> ${fileUpload.name}</li>
        <li><strong>Number of Pages:</strong> ${numPages}</li>
        <li><strong>Total Price: ₹${totalPrice}</strong></li>
      `;
      document.getElementById('orderSummary').style.display = 'block';
      document.getElementById('orderSummary').scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('paymenttype').addEventListener('click', function () {
      window.location.href = 'confirm-order.html';
    });
  </script>
</body>
</html>
