<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - E-Cafe</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4ff; margin: 0; }
    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: white; text-align: center;
      padding: 60px 20px 50px; position: relative;
    }
    header h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 8px; }
    header p { color: #adb5bd; margin: 0; font-size: 1.1rem; }
    .btn-back { position: absolute; top: 14px; left: 14px; font-weight: 600; }

    section { padding: 50px 20px; }
    .form-box {
      max-width: 620px;
      background: white; border-radius: 16px;
      padding: 40px; margin: 0 auto;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }
    .form-box h2 { font-weight: 700; color: #1a1a2e; text-align: center; margin-bottom: 6px; }
    .form-box p.sub { text-align: center; color: #888; margin-bottom: 28px; }
    label { font-weight: 600; color: #444; }
    .form-control { border-radius: 8px; border: 1px solid #d0d7ff; padding: 10px 14px; }
    .form-control:focus { border-color: #007bff; box-shadow: 0 0 0 3px rgba(0,123,255,0.1); }
    .btn-send {
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: white; border: none; border-radius: 30px;
      padding: 12px 40px; font-size: 1rem;
      font-weight: 600; cursor: pointer;
      transition: opacity 0.3s; display: block; margin: 0 auto;
    }
    .btn-send:hover { opacity: 0.9; }

    .info-cards { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 40px; justify-content: center; }
    .info-card {
      background: white; border-radius: 12px;
      padding: 20px 24px; text-align: center;
      flex: 1; min-width: 160px; max-width: 200px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    }
    .info-card .icon { font-size: 2rem; margin-bottom: 8px; }
    .info-card h6 { font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
    .info-card p { font-size: 0.85rem; color: #888; margin: 0; }

    footer { background: #111; color: #adb5bd; text-align: center; padding: 24px 20px; margin-top: 40px; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="btn btn-light btn-back">← Back</a>
    <h1>📞 Contact Us</h1>
    <p>We're here to help. Reach out to us anytime!</p>
  </header>

  <section>
    <div class="container">
      <div class="form-box">
        <h2>Get in Touch</h2>
        <p class="sub">Fill out the form and we'll get back to you shortly</p>
        <form id="contactForm">
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="name">Full Name</label>
              <input type="text" id="name" class="form-control" required placeholder="Enter your full name"/>
            </div>
            <div class="form-group col-md-6">
              <label for="email">Email Address</label>
              <input type="email" id="email" class="form-control" required placeholder="you@example.com"/>
            </div>
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" class="form-control" placeholder="How can we help?"/>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" class="form-control" rows="5" required placeholder="Write your message here..."></textarea>
          </div>
          <button type="submit" class="btn-send">📨 Send Message</button>
        </form>
      </div>

      <div class="info-cards">
        <div class="info-card">
          <div class="icon">📧</div>
          <h6>Email</h6>
          <p>support@e-cafe.com</p>
        </div>
        <div class="info-card">
          <div class="icon">🕐</div>
          <h6>Working Hours</h6>
          <p>Mon–Sat, 9am–6pm</p>
        </div>
        <div class="info-card">
          <div class="icon">💬</div>
          <h6>Live Chat</h6>
          <p>Available on website</p>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2024 E-Cafe: Your Digital Service Hub. All Rights Reserved.</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Thank you for reaching out! We will get back to you soon.');
      this.reset();
    });
  </script>
</body>
</html>
